<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:'Barlow',sans-serif; background:#050B16; color:#fff;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden; padding:24px;
  }

  /* ---- liquid flowing background: soft dark-navy blobs drifting behind the cover ---- */
  .hub-liquid-bg{ position:absolute; inset:0; overflow:hidden; z-index:0; pointer-events:none; }
  .hub-liquid-blob{ position:absolute; border-radius:50%; filter:blur(90px); }
  .hub-liquid-blob-1{
    width:560px; height:560px; top:-140px; left:-100px;
    background:radial-gradient(circle, #0A1530 0%, transparent 72%);
    animation:liquid-float-1 22s ease-in-out infinite;
  }
  .hub-liquid-blob-2{
    width:480px; height:480px; bottom:-160px; right:-80px;
    background:radial-gradient(circle, #060B18 0%, transparent 72%);
    animation:liquid-float-2 26s ease-in-out infinite;
  }
  .hub-liquid-blob-3{
    width:420px; height:420px; top:32%; left:50%;
    background:radial-gradient(circle, #0D1C42 0%, transparent 72%);
    animation:liquid-float-3 30s ease-in-out infinite;
  }
  @keyframes liquid-float-1{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(60px,40px); } }
  @keyframes liquid-float-2{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(-50px,-30px); } }
  @keyframes liquid-float-3{ 0%,100%{ transform:translate(-50%,0); } 50%{ transform:translate(-50%,-40px); } }
  .hub-liquid-fade-top{ position:absolute; top:0; left:0; right:0; height:200px; background:linear-gradient(to bottom, #050B16, transparent); }
  .hub-liquid-fade-bottom{ position:absolute; bottom:0; left:0; right:0; height:200px; background:linear-gradient(to top, #050B16, transparent); }
  @media(prefers-reduced-motion: reduce){
    .hub-liquid-blob-1, .hub-liquid-blob-2, .hub-liquid-blob-3{ animation:none; }
  }

  .hub-cta-content{ position:relative; z-index:1; text-align:center; max-width:760px; margin:0 auto; padding:0 20px; }
  .hub-brand-logo{
    width:120px; height:auto; margin:0 auto 26px; display:block; border-radius:14px;
    box-shadow:0 12px 32px rgba(0,20,90,.5);
  }
  .hub-cta-heading{
    font-family:'Instrument Serif', serif; font-style:italic; font-weight:400; color:#fff;
    font-size:44px; line-height:1.05; letter-spacing:-.4px; margin-bottom:16px;
  }
  .hub-cta-sub{
    font-family:'Barlow', sans-serif; font-weight:300; color:rgba(255,255,255,.6);
    font-size:15px; max-width:460px; margin:0 auto 38px;
  }
  @media(max-width:760px){ .hub-cta-heading{ font-size:32px; } .hub-brand-logo{ width:96px; } }

  .hub-liquid-btn-row{ display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:14px; }
  .liquid-glass-btn{
    position:relative; display:inline-flex; align-items:center; gap:10px; padding:13px 22px; border-radius:999px;
    background:rgba(255,255,255,.03); background-blend-mode:luminosity;
    backdrop-filter:blur(30px); -webkit-backdrop-filter:blur(30px);
    border:none; color:#fff; text-decoration:none;
    font-family:'Barlow',sans-serif; font-weight:500; font-size:14.5px; cursor:pointer;
    box-shadow:4px 4px 4px rgba(0,0,0,.05), inset 0 1px 1px rgba(255,255,255,.15);
    transition:background .2s ease, transform .2s ease;
  }
  .liquid-glass-btn::before{
    content:''; position:absolute; inset:0; border-radius:inherit; padding:1.4px;
    background:linear-gradient(180deg, rgba(255,255,255,.5) 0%, rgba(255,255,255,.2) 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,.2) 80%, rgba(255,255,255,.5) 100%);
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none;
  }
  .liquid-glass-btn:hover{ background:rgba(255,255,255,.1); transform:translateY(-2px); }
  .liquid-glass-btn svg{ width:18px; height:18px; flex-shrink:0; stroke:currentColor; }
  .liquid-glass-btn .lg-arrow{ width:15px; height:15px; opacity:.75; }
  @media(max-width:520px){
    .hub-liquid-btn-row{ flex-direction:column; width:100%; }
    .liquid-glass-btn{ width:100%; justify-content:center; }
  }
</style>
</head>
