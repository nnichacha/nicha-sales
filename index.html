function categoryOf(status, statuses) {
  var list = statuses || DEFAULT_STATUSES;
  for (var i = 0; i < list.length; i++) { if (list[i].name === status) return list[i].category; }
  return "Other";
}
function fmtTHB(n) {
  if (n === null || n === undefined || isNaN(n)) return "-";
  return new Intl.NumberFormat("en-US").format(Math.round(n));
}
function fmtPct(n) {
  if (n === null || n === undefined || isNaN(n)) return "-";
  return (n * 100).toFixed(1) + "%";
}
function fmtDate(s) {
  if (!s) return "-";
  var d = new Date(s + "T00:00:00");
  if (isNaN(d.getTime())) return s;
  return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "2-digit" });
}
function fmtDateTime(d) {
  if (!d) return "-";
  var dt = (d instanceof Date) ? d : new Date(d);
  if (isNaN(dt.getTime())) return "-";
  var today = new Date();
  var isToday = dt.toDateString() === today.toDateString();
  var timeStr = dt.toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" });
  if (isToday) return "วันนี้ " + timeStr + " น.";
  return dt.toLocaleDateString("th-TH", { day: "2-digit", month: "short" }) + " " + timeStr + " น.";
}
function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function attr(s) { return esc(s); }

/* ============================== CLOUD SYNC (Google Sheets via Apps Script) ============================== */
function scheduleCloudPush() {
  if (!STATE.cloudUrl) return;
  window.clearTimeout(STATE.syncTimer);
  STATE.syncTimer = window.setTimeout(pushToCloud, 900);
}

function pushToCloud() {
  if (!STATE.cloudUrl) return;
  if (STATE.googleClientId && !isTokenValid()) { STATE.syncStatus = "error"; renderSidebarFooter(); return; }
  if (STATE.googleClientId && STATE.auth.role && STATE.auth.role !== "editor") { return; } // viewers never write
  STATE.syncStatus = "syncing";
  renderSidebarFooter();
  var payload = JSON.stringify({
    projects: STATE.projects, statuses: STATE.statuses, dailyReports: STATE.dailyReports,
    idToken: STATE.auth.idToken || ""
  });
  fetch(STATE.cloudUrl, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: payload
  }).then(function (res) { return res.json(); })
    .then(function (res) {
      if (res && res.unauthorized) { handleUnauthorized(res.error); return; }
      if (res && res.role) { STATE.auth.role = res.role; saveAuthSession(); }
      STATE.syncStatus = res && res.ok ? "synced" : "error";
      STATE.lastSyncedAt = new Date();
      renderSidebarFooter();
    })
    .catch(function () {
      STATE.syncStatus = "error";
      renderSidebarFooter();
    });
}

function pullFromCloud(showToastOnDone) {
  if (!STATE.cloudUrl) return;
  if (STATE.googleClientId && !isTokenValid()) { STATE.syncStatus = "error"; renderSidebarFooter(); return; }
  STATE.syncStatus = "syncing";
  renderSidebarFooter();
  var qs = STATE.auth.idToken ? ("?idToken=" + encodeURIComponent(STATE.auth.idToken)) : "";
  fetch(STATE.cloudUrl + qs, { method: "GET" })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (data && data.unauthorized) { handleUnauthorized(data.error); return; }
      if (data && data.role) { STATE.auth.role = data.role; saveAuthSession(); }
      if (data && Array.isArray(data.projects) && data.projects.length > 0) {
        STATE.projects = data.projects.map(normalizeCloudProject);
        if (Array.isArray(data.statuses) && data.statuses.length) STATE.statuses = data.statuses;
        if (Array.isArray(data.dailyReports)) STATE.dailyReports = data.dailyReports;
        LocalStore.set(STORAGE_KEY, JSON.stringify(STATE.projects));
        LocalStore.set(STATUS_KEY, JSON.stringify(STATE.statuses));
        LocalStore.set(DAILY_REPORTS_KEY, JSON.stringify(STATE.dailyReports));
        STATE.syncStatus = "synced";
        STATE.lastSyncedAt = new Date();
        renderApp();
        if (showToastOnDone) showToast("ดึงข้อมูลล่าสุดจากคลาวด์แล้ว");
      } else {
        STATE.syncStatus = "synced";
        renderSidebarFooter();
        if (!STATE.googleClientId || STATE.auth.role === "editor") pushToCloud();
        if (showToastOnDone) showToast("คลาวด์ยังไม่มีข้อมูล — อัปโหลดข้อมูลปัจจุบันขึ้นไปให้แล้ว");
      }
    })
    .catch(function () {
      STATE.syncStatus = "error";
      renderSidebarFooter();
      if (showToastOnDone) showToast("เชื่อมต่อคลาวด์ไม่สำเร็จ — ใช้ข้อมูลในเครื่องต่อไป");
    });
}

/* ============================== FIREBASE REALTIME SYNC ============================== */
function firebaseDataUrl() {
  var base = STATE.firebaseUrl.replace(/\/$/, "");
  return base + "/emtData.json";
}

function scheduleFirebasePush() {
  if (!STATE.firebaseUrl) return;
  if (!canEdit()) return;
  window.clearTimeout(STATE.firebasePushTimer);
  STATE.firebasePushTimer = window.setTimeout(firebasePush, 700);
}

function firebasePush() {
  if (!STATE.firebaseUrl || !canEdit()) return;
  STATE.firebaseStatus = "syncing";
  renderSidebarFooter();
  var payload = JSON.stringify({
    projects: STATE.projects, statuses: STATE.statuses, dailyReports: STATE.dailyReports,
    updatedAt: new Date().toISOString(), updatedBy: (STATE.auth && STATE.auth.email) || "local"
  });
  fetch(firebaseDataUrl(), { method: "PUT", headers: { "Content-Type": "application/json" }, body: payload })
    .then(function (res) { return res.json(); })
    .then(function () { STATE.firebaseStatus = "synced"; renderSidebarFooter(); })
    .catch(function () { STATE.firebaseStatus = "error"; renderSidebarFooter(); });
}

function applyRemoteData(data) {
  if (!data) return;
  var changed = false;
  if (Array.isArray(data.projects)) { STATE.projects = data.projects.map(normalizeCloudProject); changed = true; }
  if (Array.isArray(data.statuses) && data.statuses.length) { STATE.statuses = data.statuses; changed = true; }
  if (Array.isArray(data.dailyReports)) { STATE.dailyReports = data.dailyReports; changed = true; }
  if (!changed) return;
  LocalStore.set(STORAGE_KEY, JSON.stringify(STATE.projects));
  LocalStore.set(STATUS_KEY, JSON.stringify(STATE.statuses));
  LocalStore.set(DAILY_REPORTS_KEY, JSON.stringify(STATE.dailyReports));
  var busy = STATE.formOpen || STATE.statusManagerOpen || STATE.confirmDeleteId !== null || STATE.importPending;
  var typing = document.activeElement && ["INPUT", "SELECT", "TEXTAREA"].indexOf(document.activeElement.tagName) !== -1;
  if (!busy && !typing) { renderApp(); showToast("อัปเดตข้อมูลแบบเรียลไทม์จากอุปกรณ์อื่น"); }
}

function firebaseReadOnce() {
  if (!STATE.firebaseUrl) return;
  STATE.firebaseStatus = "syncing";
  renderSidebarFooter();
  fetch(firebaseDataUrl())
    .then(function (res) { return res.json(); })
    .then(function (data) {
      STATE.firebaseStatus = "synced";
      if (data) { applyRemoteData(data); }
      else { firebasePush(); } // empty DB -> seed it with current local data
      renderSidebarFooter();
    })
    .catch(function () { STATE.firebaseStatus = "error"; renderSidebarFooter(); });
}

function firebaseStartListening() {
  if (!STATE.firebaseUrl || typeof window.EventSource === "undefined") return;
  if (STATE.firebaseES) { try { STATE.firebaseES.close(); } catch (e) {} }
  try {
    var es = new EventSource(firebaseDataUrl());
    es.addEventListener("put", function (e) {
      try {
        var msg = JSON.parse(e.data);
        if (msg.path === "/") applyRemoteData(msg.data);
        else firebaseReadOnce();
      } catch (err) {}
    });
    es.addEventListener("patch", function () { firebaseReadOnce(); });
    es.onopen = function () { STATE.firebaseStatus = "live"; renderSidebarFooter(); };
    es.onerror = function () { STATE.firebaseStatus = "error"; renderSidebarFooter(); };
    STATE.firebaseES = es;
  } catch (e) { /* EventSource blocked or unsupported */ }
}

function changeFirebaseUrl() {

/* ============================== GOOGLE LOGIN ============================== */
function decodeJwt(token) {
  try {
    var base64Url = token.split(".")[1];
    var base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
    var jsonStr = decodeURIComponent(
      atob(base64).split("").map(function (c) { return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2); }).join("")
    );
    return JSON.parse(jsonStr);
  } catch (e) { return null; }
}

function isTokenValid() {
  return !!(STATE.auth && STATE.auth.signedIn && STATE.auth.idToken && STATE.auth.exp > Date.now());
}

function needsLoginGate() {
  return !!STATE.googleClientId && !isTokenValid();
}

function canEdit() {
  if (!STATE.googleClientId) return true; // no login configured = single-user local mode
  return STATE.auth.role === "editor";
}

function saveAuthSession() {
  LocalStore.set(AUTH_KEY, JSON.stringify(STATE.auth));
}

function handleGoogleCredential(response) {
  var claims = decodeJwt(response.credential);
  if (!claims) { STATE.authError = "อ่านข้อมูลบัญชีไม่สำเร็จ"; renderApp(); return; }
  STATE.auth = {
    signedIn: true, email: claims.email, name: claims.name, picture: claims.picture,
    idToken: response.credential, exp: claims.exp * 1000, role: null
  };
  STATE.authError = null;
  saveAuthSession();
  renderApp();
  if (STATE.cloudUrl) pullFromCloud(false);
}

function signOut() {
  STATE.auth = { signedIn: false, email: null, name: null, picture: null, idToken: null, exp: 0, role: null };
  LocalStore.set(AUTH_KEY, "");
  try { if (window.google && window.google.accounts) window.google.accounts.id.disableAutoSelect(); } catch (e) {}
  renderApp();
}

}

function initGoogleSignInWidget() {
  var tries = 0;
  function attempt() {
    tries++;
    if (window.google && window.google.accounts && window.google.accounts.id) {
      try {
        window.google.accounts.id.initialize({ client_id: STATE.googleClientId, callback: handleGoogleCredential });
        var el = document.getElementById("google-signin-btn");
        if (el) window.google.accounts.id.renderButton(el, { theme: "outline", size: "large", width: 280, text: "signin_with" });
      } catch (e) { /* ignore, will show manual message */ }
      return;
    }
    if (tries < 50) window.setTimeout(attempt, 100);
  }
  attempt();
}

/* ============================== DERIVED ANALYTICS ============================== */
function computeFocusData() {
  var d = computeDerived();
  var rows = d.withCat.filter(function (p) { return p.category === "Won"; });
  var dim = STATE.focusDimension;
  var metric = STATE.focusMetric;
  var map = {}, order = [];
  rows.forEach(function (p) {
    var key = dim === "customer" ? p.customer : (p.month || "ไม่ระบุ");
    if (!map[key]) { map[key] = { label: key, value: 0, count: 0 }; order.push(key); }
    map[key].value += p.sale || 0;
    map[key].count += 1;
  });
  var arr = order.map(function (k) { return map[k]; });
  if (dim === "month") {
    var monthOrder = MONTHS.slice(0, 12);
    arr.sort(function (a, b) { return monthOrder.indexOf(a.label) - monthOrder.indexOf(b.label); });
  } else {
    arr.sort(function (a, b) { return b.value - a.value; });
    if (arr.length > 7) {
      var top = arr.slice(0, 7);
      var rest = arr.slice(7);
      var restAgg = {
        label: "อื่นๆ (" + rest.length + " ราย)",
        value: rest.reduce(function (s, x) { return s + x.value; }, 0),
        count: rest.reduce(function (s, x) { return s + x.count; }, 0)
      };
      arr = top.concat([restAgg]);
    }
  }
  return arr;
}

function parseThaiDateSlash(s) {
  // expects DD/MM/YY or DD/MM/YYYY -> returns YYYY-MM-DD or ""
  if (!s) return "";
  var m = s.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (!m) return "";
  var dd = parseInt(m[1], 10), mm = parseInt(m[2], 10), yy = parseInt(m[3], 10);
  if (yy < 100) yy += 2000;
  if (mm < 1 || mm > 12 || dd < 1 || dd > 31) return "";
  return yy + "-" + (mm < 10 ? "0" : "") + mm + "-" + (dd < 10 ? "0" : "") + dd;
}
function parseSaleNumber(s) {
  if (!s) return 0;
  var n = parseFloat(String(s).replace(/[, ]/g, ""));
  return isNaN(n) ? 0 : n;
}

function parseBulkText(text) {
  var lines = text.split(/\r?\n/).map(function (l) { return l; }).filter(function (l) { return l.trim() !== ""; });
  return lines.map(function (line) {
    var cols = line.split("\t");
    if (cols.length < 2) cols = line.split(/ {2,}/); // fallback if tabs got collapsed to spaces

      customer: get(4),

  });
}

function computeMonthlySeries(filterFn) {
  var d = computeDerived();
  var months = MONTHS.slice(0, 8);
  return months.map(function (m) {
    var rows = d.withCat.filter(function (p) { return p.category === "Won" && p.month === m && filterFn(p); });
    return { label: m, value: rows.reduce(function (s, p) { return s + (p.sale || 0); }, 0), count: rows.length };
  });
}
function computeQuarterlySeries(filterFn) {
  var d = computeDerived();
  var qMap = { "Q1": ["Jan", "Feb", "Mar"], "Q2": ["Apr", "May", "Jun"], "Q3": ["Jul", "Aug", "Sep"], "Q4": ["Oct", "Nov", "Dec"] };
  return Object.keys(qMap).map(function (q) {
    var rows = d.withCat.filter(function (p) { return p.category === "Won" && qMap[q].indexOf(p.month) !== -1 && filterFn(p); });
    return { label: q, value: rows.reduce(function (s, p) { return s + (p.sale || 0); }, 0), count: rows.length };
  });
}

function computeDerived() {
  var statuses = STATE.statuses;
  var withCat = STATE.projects.map(function (p) {
    var c = Object.assign({}, p);
    c.category = categoryOf(p.status, statuses);
    return c;
  });

  var statusColorMap = {};
  statuses.forEach(function (s) { statusColorMap[s.name] = s.color; });

  var totalQuoted = 0, won = 0, lost = 0, pending = 0, wonJobs = 0, lostJobs = 0;
  var customerSet = {};
  withCat.forEach(function (p) {
    var sale = p.sale || 0;
    totalQuoted += sale;
    customerSet[p.customer] = true;
    if (p.category === "Won") { won += sale; wonJobs++; }
    else if (p.category === "Lost") { lost += sale; lostJobs++; }
    else if (p.category === "Pending") { pending += sale; }
  });
  var winRate = (wonJobs + lostJobs) > 0 ? wonJobs / (wonJobs + lostJobs) : 0;
  var kpis = {
    totalQuoted: totalQuoted, won: won, lost: lost, pending: pending, winRate: winRate,
    customers: Object.keys(customerSet).length, totalJobs: withCat.length
  };

  var custMap = {};
  var custOrder = [];
  withCat.forEach(function (p) {
    if (!custMap[p.customer]) {
      custMap[p.customer] = {
        customer: p.customer, segment: p.segment, type: p.type,
        totalQuoted: 0, won: 0, lost: 0, pending: 0, machineWon: 0, fabWon: 0,
        totalJobs: 0, wonJobs: 0, lostJobs: 0
      };
      custOrder.push(p.customer);
    }
    var c = custMap[p.customer];
    var sale = p.sale || 0;
    c.totalQuoted += sale;
    c.totalJobs += 1;
    if (p.category === "Won") {
      c.won += sale; c.wonJobs += 1;
      if (p.workType === "M") c.machineWon += sale;
      if (p.workType === "F") c.fabWon += sale;
    } else if (p.category === "Lost") { c.lost += sale; c.lostJobs += 1; }
    else if (p.category === "Pending") { c.pending += sale; }
  });
  var byCustomer = custOrder.sort().map(function (name) {
    var c = custMap[name];
    c.winRate = (c.wonJobs + c.lostJobs) > 0 ? c.wonJobs / (c.wonJobs + c.lostJobs) : null;
    c.avgDeal = c.wonJobs > 0 ? c.won / c.wonJobs : null;
    return c;
  });

  var byStatus = statuses.map(function (s) {
    var rows = withCat.filter(function (p) { return p.status === s.name; });
    var value = rows.reduce(function (sum, p) { return sum + (p.sale || 0); }, 0);
    return { status: s.name, category: s.category, count: rows.length, value: value };
  });

  var monthlyTrend = MONTHS.slice(0, 8).map(function (m) {
    var value = withCat.filter(function (p) { return p.month === m && p.category === "Won"; })
      .reduce(function (s, p) { return s + (p.sale || 0); }, 0);
    return { month: m, value: value };
  });

  var machineWonTotal = withCat.filter(function (p) { return p.category === "Won" && p.workType === "M"; }).reduce(function (s, p) { return s + (p.sale || 0); }, 0);
  var fabWonTotal = withCat.filter(function (p) { return p.category === "Won" && p.workType === "F"; }).reduce(function (s, p) { return s + (p.sale || 0); }, 0);
  var machineWonCount = withCat.filter(function (p) { return p.category === "Won" && p.workType === "M"; }).length;
  var fabWonCount = withCat.filter(function (p) { return p.category === "Won" && p.workType === "F"; }).length;
  var workTypeSplit = [
    { name: "Machine (M)", value: machineWonTotal, count: machineWonCount, key: "M" },
    { name: "Fabrication (F)", value: fabWonTotal, count: fabWonCount, key: "F" }
  ];

  var segmentSplit = SEGMENTS.map(function (s) {
    var rows = withCat.filter(function (p) { return p.category === "Won" && p.segment === s; });
    var value = rows.reduce(function (sum, p) { return sum + (p.sale || 0); }, 0);
    return { name: s, value: value, count: rows.length };
  });

  var top5Customers = byCustomer.slice().sort(function (a, b) { return b.won - a.won; }).slice(0, 5);

  function sortDesc(arr, key) { return arr.slice().sort(function (a, b) { return (b[key] == null ? -Infinity : b[key]) - (a[key] == null ? -Infinity : a[key]); }); }
  var withThresholds = byCustomer.map(function (c) {
    var d = Object.assign({}, c);
    d._winRate = c.totalJobs >= 3 ? c.winRate : null;
    d._avgDeal = c.wonJobs >= 1 ? c.avgDeal : null;
    return d;
  });
  var top10 = {
    won: sortDesc(withThresholds, "won").slice(0, 10),
    machine: sortDesc(withThresholds, "machineWon").slice(0, 10),
    fab: sortDesc(withThresholds, "fabWon").slice(0, 10),
    jobs: sortDesc(withThresholds, "totalJobs").slice(0, 10),
    winRate: withThresholds.filter(function (c) { return c._winRate !== null; }).sort(function (a, b) { return b._winRate - a._winRate; }).slice(0, 10),
    avgDeal: withThresholds.filter(function (c) { return c._avgDeal !== null; }).sort(function (a, b) { return b._avgDeal - a._avgDeal; }).slice(0, 10),
    lost: sortDesc(withThresholds, "lost").slice(0, 10),
    quoted: sortDesc(withThresholds, "totalQuoted").slice(0, 10)
  };

  // commission: auto-detect "Done Q<n>" pattern statuses
  var qRe = /^done\s*q\s*(\d+)$/i;
  var quarterStatuses = [];
  statuses.forEach(function (s) {
    var m = s.name.match(qRe);
    if (m) quarterStatuses.push({ name: s.name, q: parseInt(m[1], 10) });
  });
  quarterStatuses.sort(function (a, b) { return a.q - b.q; });
  var currentQ = quarterStatuses.length ? quarterStatuses[quarterStatuses.length - 1] : null;
  var closedQuarters = currentQ ? quarterStatuses.filter(function (q) { return q.q !== currentQ.q; }) : [];
  var closedGroups = closedQuarters.map(function (cq) {
    var rows = withCat.filter(function (p) { return p.status === cq.name; });
    return { name: cq.name, jobs: rows.length, value: rows.reduce(function (s, p) { return s + (p.sale || 0); }, 0) };
  });
  var commissionRows = closedQuarters.length
    ? withCat.filter(function (p) { return closedQuarters.some(function (cq) { return cq.name === p.status; }); })
      .sort(function (a, b) { return (a.requestedDate || "").localeCompare(b.requestedDate || ""); })
    : [];
  var otherOpenStatuses = statuses.filter(function (s) {
    if (currentQ && s.name === currentQ.name) return false;
    if (closedQuarters.some(function (cq) { return cq.name === s.name; })) return false;
    return s.category === "Won" || s.category === "Pending";
  });
  var currentContext = [];
  if (currentQ) currentContext.push({ label: currentQ.name + " (เสร็จแล้ว รอคอมมิชชั่น)", rows: withCat.filter(function (p) { return p.status === currentQ.name; }) });
  otherOpenStatuses.forEach(function (s) { currentContext.push({ label: s.name, rows: withCat.filter(function (p) { return p.status === s.name; }) }); });
  var commissionLabel = "Commission";
  var commissionSub = currentQ
    ? "Q" + currentQ.q + " คือไตรมาสปัจจุบันที่กำลังดำเนินอยู่"
    : 'เพิ่มสถานะรูปแบบ "Done Q4" ใน "จัดการสถานะ" เพื่อให้ระบบตรวจจับไตรมาสอัตโนมัติ';
  var commission = { closedGroups: closedGroups, rows: commissionRows, currentContext: currentContext, label: commissionLabel, sub: commissionSub, hasQuarters: quarterStatuses.length > 0 };

  var customerNames = Object.keys(custMap).sort();

  return {
    withCat: withCat, statusColorMap: statusColorMap, kpis: kpis, byCustomer: byCustomer, byStatus: byStatus,
    monthlyTrend: monthlyTrend, workTypeSplit: workTypeSplit, segmentSplit: segmentSplit,
    top5Customers: top5Customers, top10: top10, commission: commission, customerNames: customerNames
  };
}

/* ============================== SVG CHARTS ============================== */
function svgLineChart(data, xKey, yKey, color, height) {
  color = color || COLORS.blue; height = height || 220;
  var W = 560, H = height, padL = 44, padR = 14, padT = 14, padB = 26;
  var max = Math.max.apply(null, [1].concat(data.map(function (d) { return d[yKey] || 0; })));
  var innerW = W - padL - padR, innerH = H - padT - padB;
  var stepX = data.length > 1 ? innerW / (data.length - 1) : 0;
  var pts = data.map(function (d, i) {
    var x = padL + i * stepX;
    var y = padT + innerH - ((d[yKey] || 0) / max) * innerH;
    return { x: x, y: y, label: d[xKey], value: d[yKey] };
  });
  var path = pts.map(function (p, i) { return (i === 0 ? "M " : "L ") + p.x + " " + p.y; }).join(" ");
  var grid = [0, 0.25, 0.5, 0.75, 1];
  var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:' + H + 'px">';
  grid.forEach(function (g) {
    var y = padT + innerH * (1 - g);
    out += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y + '" y2="' + y + '" stroke="' + COLORS.line + '" stroke-width="1"/>';
    out += '<text x="' + (padL - 8) + '" y="' + (y + 3) + '" font-size="9" fill="' + COLORS.muted + '" text-anchor="end">' + Math.round((max * g) / 1000) + 'k</text>';
  });
  out += '<path d="' + path + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function (p) {
    out += '<circle cx="' + p.x + '" cy="' + p.y + '" r="3.4" fill="' + color + '"><title>' + esc(p.label) + ": " + fmtTHB(p.value) + ' THB</title></circle>';
    out += '<text x="' + p.x + '" y="' + (H - 6) + '" font-size="10" fill="' + COLORS.muted + '" text-anchor="middle">' + esc(p.label) + '</text>';
  });
  out += '</svg>';
  return out;
}

function svgBarChart(data, xKey, yKey, opts) {
  opts = opts || {};
  var color = opts.color || COLORS.blue, colors = opts.colors, height = opts.height || 220, horizontal = !!opts.horizontal;
  var W = 560, H = height;
  var max = Math.max.apply(null, [1].concat(data.map(function (d) { return d[yKey] || 0; })));
  var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:' + H + 'px">';
  if (horizontal) {
    var padL = 90, padR = 50, padT = 6, padB = 6;
    var innerW = W - padL - padR;
    var rowH = (H - padT - padB) / data.length;
    data.forEach(function (d, i) {
      var w = ((d[yKey] || 0) / max) * innerW;
      var y = padT + i * rowH + rowH * 0.2;

function polarToCartesian(cx, cy, r, angleDeg) {
  var rad = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}
function donutArcPath(cx, cy, rOuter, rInner, startAngle, endAngle) {
  var startOuter = polarToCartesian(cx, cy, rOuter, endAngle);
  var endOuter = polarToCartesian(cx, cy, rOuter, startAngle);
  var startInner = polarToCartesian(cx, cy, rInner, endAngle);
  var endInner = polarToCartesian(cx, cy, rInner, startAngle);
  var largeArc = (endAngle - startAngle) > 180 ? 1 : 0;
  return ["M", startOuter.x, startOuter.y, "A", rOuter, rOuter, 0, largeArc, 0, endOuter.x, endOuter.y,
    "L", endInner.x, endInner.y, "A", rInner, rInner, 0, largeArc, 1, startInner.x, startInner.y, "Z"].join(" ");
}

function svgFocusDonut(data, valueKey, nameKey, colors, poppedIndex, size, totalLabel, onClickFn) {

    return {
      i: i, path: donutArcPath(CX, CY, R_OUT, R_IN, start, end),

function svgPieChart(data, valueKey, nameKey, colors, height) {

function focusToggleBtn(value, current, label) {
  var active = value === current;
  var onclickFn = (value === "customer" || value === "month") ? "setFocusDimension" : "setFocusMetric";
  return '<button onclick="' + onclickFn + '(\'' + value + '\')" style="font-size:10.5px;font-weight:600;padding:5px 11px;border-radius:6px;border:1px solid ' +
    (active ? "#C9A227" : "#2A3441") + ';background:' + (active ? "#C9A227" : "transparent") + ';color:' + (active ? "#1B1400" : "#94A3B8") + ';cursor:pointer">' + esc(label) + '</button>';

function buildFocusCardInner() {
  var data = computeFocusData();
  var colors = data.map(function (_, i) { return PIE_COLORS[i % PIE_COLORS.length]; });
  var donut = svgFocusDonut(data, "value", "label", colors, STATE.focusPopped, 200);
  var total = data.reduce(function (s, x) { return s + (x.value || 0); }, 0) || 1;
  var legend = data.map(function (x, i) {
    var pct = ((x.value || 0) / total * 100).toFixed(1);

    return '<div onclick="toggleFocusSegment(' + i + ')" style="display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:6px;cursor:pointer;background:' + (popped ? "rgba(201,162,39,0.15)" : "transparent") + '">' +
      '<span style="width:9px;height:9px;border-radius:3px;background:' + colors[i] + ';flex-shrink:0"></span>' +
      '<span style="font-size:11px;color:' + (popped ? "#fff" : "#C9CFDA") + ';flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(x.label) + '</span>' +
      '<span class="mono" style="font-size:9.5px;color:#6B7A90">' + x.count + ' งาน</span>' +

      '<span class="mono" style="font-size:10.5px;color:#fff;min-width:64px;text-align:right">' + fmtTHB(x.value) + '</span></div>';

function monthKeyFromProject(p) {
  var raw = p.sendQu || p.requestedDate;
  if (!raw) return null;
  var m = String(raw).match(/^(\d{4})-(\d{2})-\d{2}/);
  if (!m) return null;
  var yy = m[1], mm = parseInt(m[2], 10);
  return { key: yy + "-" + m[2], label: TH_MONTH_LABELS[mm - 1] + " " + (parseInt(yy, 10) + 543).toString().slice(-2) };
}

function computeSummaryBreakdown(dimension) {
  var d = computeDerived();
  var rows = d.withCat.filter(function (p) { return p.category === "Won"; });
  var map = {}, order = [];
  rows.forEach(function (p) {
    var key, label;
    if (dimension === "month") {
      var mk = monthKeyFromProject(p);
      if (!mk) { key = "ไม่ระบุ"; label = "ไม่ระบุวันที่"; } else { key = mk.key; label = mk.label; }
    } else if (dimension === "customer") {
      key = p.customer || "(ไม่ระบุ)"; label = key;
    } else { // workType
      key = p.workType === "M" ? "M" : p.workType === "F" ? "F" : "ไม่ระบุ";
      label = key === "M" ? "Machine (M)" : key === "F" ? "Fabrication (F)" : "ไม่ระบุประเภท";
    }
    if (!map[key]) { map[key] = { key: key, label: label, count: 0, value: 0 }; order.push(key); }
    map[key].count += 1;
    map[key].value += p.sale || 0;
  });
  var arr = order.map(function (k) { return map[k]; });
  if (dimension === "month") {
    arr.sort(function (a, b) { return a.key === "ไม่ระบุ" ? 1 : b.key === "ไม่ระบุ" ? -1 : a.key.localeCompare(b.key); });
  } else {
    arr.sort(function (a, b) { return STATE.summarySortDir === "asc" ? a[STATE.summarySortKey] - b[STATE.summarySortKey] : b[STATE.summarySortKey] - a[STATE.summarySortKey]; });
  }
  return arr;
}

function getFilteredSortedProjects(d) {
  var ui = STATE.projectsUI;
  var rows = d.withCat;
  if (ui.q.trim()) {
    var qq = ui.q.trim().toLowerCase();
    rows = rows.filter(function (p) {
      return [p.customer, p.description, p.invoice, p.note, p.name].some(function (f) { return (f || "").toLowerCase().indexOf(qq) !== -1; });
    });
  }
  if (ui.status) rows = rows.filter(function (p) { return p.status === ui.status; });
  if (ui.workType) rows = rows.filter(function (p) { return p.workType === ui.workType; });
  rows = rows.slice().sort(function (a, b) {
    var va = a[ui.sortKey], vb = b[ui.sortKey];
    if (ui.sortKey === "sale" || ui.sortKey === "id") { va = Number(va) || 0; vb = Number(vb) || 0; }
    else { va = (va || "").toString().toLowerCase(); vb = (vb || "").toString().toLowerCase(); }
    if (va < vb) return ui.sortDir === "asc" ? -1 : 1;
    if (va > vb) return ui.sortDir === "asc" ? 1 : -1;
    return 0;
  });
  return rows;
}

function onProjectsSearch(v) { STATE.projectsUI.q = v; STATE.projectsUI.page = 1; refreshProjectsTable(); focusPreserve("projects-search"); }
function onProjectsStatusFilter(v) { STATE.projectsUI.status = v; STATE.projectsUI.page = 1; refreshProjectsTable(); }
function onProjectsWorkTypeFilter(v) { STATE.projectsUI.workType = v; STATE.projectsUI.page = 1; refreshProjectsTable(); }
function onProjectsSort(key) {
  var ui = STATE.projectsUI;
  if (ui.sortKey === key) ui.sortDir = ui.sortDir === "asc" ? "desc" : "asc";
  else { ui.sortKey = key; ui.sortDir = "desc"; }
  refreshProjectsTable();
}
function onProjectsPage(delta) { STATE.projectsUI.page += delta; refreshProjectsTable(); }
function effVal(p, field) {
  var pe = STATE.pendingEdits[p.id];
  return (pe && Object.prototype.hasOwnProperty.call(pe, field)) ? pe[field] : p[field];
}
function stageEdit(id, field, value) {
  if (!canEdit()) { showToast("คุณมีสิทธิ์ดูข้อมูลอย่างเดียว ไม่สามารถแก้ไขได้"); return; }
  if (field === "sale") value = Number(value) || 0;
  if (!STATE.pendingEdits[id]) STATE.pendingEdits[id] = {};
  STATE.pendingEdits[id][field] = value;
  refreshProjectsTable();
}
function saveRowEdit(id) {
  var patch = STATE.pendingEdits[id];
  if (!patch) return;
  updateProject(id, patch);
  delete STATE.pendingEdits[id];
  refreshProjectsTable();
  renderSidebarFooter();
  refreshSidebarNav();
}
function cancelRowEdit(id) {
  delete STATE.pendingEdits[id];
  refreshProjectsTable();
  showToast("ยกเลิกการแก้ไขแล้ว ไม่ได้บันทึก");
}
function saveAllPendingEdits() {
  var ids = Object.keys(STATE.pendingEdits);
  if (ids.length === 0) return;
  ids.forEach(function (id) { updateProject(Number(id), STATE.pendingEdits[id]); });
  STATE.pendingEdits = {};
  refreshProjectsTable();
  renderSidebarFooter();
  refreshSidebarNav();
  showToast("บันทึกการแก้ไขทั้งหมดแล้ว");
}
function discardAllPendingEdits() {
  STATE.pendingEdits = {};
  refreshProjectsTable();
  showToast("ยกเลิกการแก้ไขทั้งหมดแล้ว");
}
function refreshSidebarNav() {
  var d = computeDerived();
  var navHtml = NAV_ITEMS.map(function (n) {
    var active = STATE.tab === n.key;
    return '<button class="sidebar-btn' + (active ? " active" : "") + '" onclick="setTab(\'' + n.key + '\')">' + icon(n.icon, 17) + '<span>' + esc(n.label) + '</span></button>';
  }).join("") +
    '<button class="sidebar-btn' + (STATE.tab === "commission" ? " active" : "") + '" onclick="tryOpenCommission()">' + icon("wallet", 17) + '<span>' + esc(d.commission.label) + '</span></button>' +
    '<button class="sidebar-btn" onclick="openStatusManager()">' + icon("settings", 17) + '<span>จัดการสถานะ</span></button>';
  var navEl = document.querySelector("aside nav");
  if (navEl) navEl.innerHTML = navHtml;
}

function focusPreserve(inputId) {
  window.requestAnimationFrame(function () {
    var el = document.getElementById(inputId);
    if (el && document.activeElement !== el) { /* leave as is; search input isn't re-created so focus persists naturally */ }
  });
}

function renderCustomersShell(d) {

function refreshCustomersTable(d) {
  d = d || computeDerived();
  var wrap = document.getElementById("customers-table-wrap");
  if (!wrap) return;
  var ui = STATE.customersUI;
  var rows = d.byCustomer;
  if (ui.q.trim()) {
    var qq = ui.q.trim().toLowerCase();
    rows = rows.filter(function (c) { return c.customer.toLowerCase().indexOf(qq) !== -1; });
  }
  rows = rows.slice().sort(function (a, b) {
    var va = a[ui.sortKey], vb = b[ui.sortKey];
    if (typeof va === "string") { va = va.toLowerCase(); vb = (vb || "").toLowerCase(); }
    else { va = va == null ? -Infinity : va; vb = vb == null ? -Infinity : vb; }
    if (va < vb) return ui.sortDir === "asc" ? -1 : 1;
    if (va > vb) return ui.sortDir === "asc" ? 1 : -1;
    return 0;
  });

  function th(label, key, width, align) {
    var w = width ? ' style="width:' + width + 'px;text-align:' + (align || "left") + '"' : (align ? ' style="text-align:' + align + '"' : "");
    var active = ui.sortKey === key;
    var justify = align === "right" ? "flex-end" : "flex-start";
    return '<th class="th-cell"' + w + ' onclick="onCustomersSort(\'' + key + '\')"><span style="display:flex;align-items:center;gap:4px;justify-content:' + justify + '">' + esc(label) + '<span style="opacity:' + (active ? 1 : 0.3) + '">' + icon("sort", 11) + '</span></span></th>';
  }

  var rowsHtml = rows.map(function (c, i) {
    var bg = i % 2 ? COLORS.canvas : "#fff";
    return '<tr class="row-hover" style="background:' + bg + '">' +
      '<td class="td-cell"><strong style="font-size:12.5px">' + esc(c.customer) + '</strong></td>' +
      '<td class="td-cell"><div style="font-size:12px">' + esc(c.segment) + '</div><div style="font-size:11px;color:' + COLORS.muted + '">' + esc(c.type) + '</div></td>' +
      '<td class="td-cell num-td">' + fmtTHB(c.totalQuoted) + '</td>' +
      '<td class="td-cell num-td" style="color:' + COLORS.green + ';font-weight:600">' + fmtTHB(c.won) + '</td>' +
      '<td class="td-cell num-td" style="color:' + COLORS.red + '">' + fmtTHB(c.lost) + '</td>' +
      '<td class="td-cell num-td">' + fmtTHB(c.machineWon) + '</td>' +
      '<td class="td-cell num-td">' + fmtTHB(c.fabWon) + '</td>' +
      '<td class="td-cell num-td">' + c.totalJobs + '</td>' +
      '<td class="td-cell num-td">' + fmtPct(c.winRate) + '</td>' +
      '<td class="td-cell num-td">' + fmtTHB(c.avgDeal) + '</td></tr>';
  }).join("");

  wrap.innerHTML = '<div class="card" style="padding:0;overflow:hidden"><div style="overflow-x:auto"><table><thead><tr>' +
    th("ลูกค้า", "customer", 140) + '<th class="th-cell">Segment / Type</th>' +
    th("Total Quoted", "totalQuoted", 110, "right") + th("Won", "won", 110, "right") + th("Lost", "lost", 100, "right") +
    th("Machine Won", "machineWon", 110, "right") + th("Fab Won", "fabWon", 100, "right") + th("Jobs", "totalJobs", 64, "right") +
    th("Win %", "winRate", 72, "right") + th("Avg Deal", "avgDeal", 100, "right") +
    '</tr></thead><tbody>' + rowsHtml + '</tbody></table></div></div>';
}
function onCustomersSearch(v) { STATE.customersUI.q = v; refreshCustomersTable(); }
function onCustomersSort(key) {
  var ui = STATE.customersUI;
  if (ui.sortKey === key) ui.sortDir = ui.sortDir === "asc" ? "desc" : "asc";

  }
  var totalValue = c.closedGroups.reduce(function (s, g) { return s + g.value; }, 0);
  var kpiCols = c.closedGroups.length * 2 + 1;
  var kpiHtml = '<div style="display:grid;grid-template-columns:repeat(' + kpiCols + ',1fr);gap:12px;margin-bottom:18px">';
  c.closedGroups.forEach(function (g, i) {

    kpiHtml += kpiCardHtml(g.name + " — Jobs", g.jobs, "", tone) + kpiCardHtml(g.name + " — Value", fmtTHB(g.value), "", tone);
  });

function nowHHMM() {
  var d = new Date();
  return (d.getHours() < 10 ? "0" : "") + d.getHours() + ":" + (d.getMinutes() < 10 ? "0" : "") + d.getMinutes();
}
function todayISO() {
  var d = new Date();
  return d.getFullYear() + "-" + (d.getMonth() + 1 < 10 ? "0" : "") + (d.getMonth() + 1) + "-" + (d.getDate() < 10 ? "0" : "") + d.getDate();
}

function buildDailyRoadSvg(entries, distId) {
  var n = entries.length;
  if (n < 2) return "";
  var segW = 190;
  var W = Math.max(600, (n - 1) * segW + 120);
  var H = 170;
  var midY = 98;
  var amp = 30;
  var pts = [];
  for (var i = 0; i < n; i++) {
    var x = 60 + i * segW;
    var y = midY + (i % 2 === 0 ? -amp * 0.4 : amp * 0.6) * (i === 0 || i === n - 1 ? 0.3 : 1);
    pts.push([x, y]);
  }
  function smoothPath(p) {
    var d = "M " + p[0][0] + "," + p[0][1] + " ";
    for (var i = 0; i < p.length - 1; i++) {
      var p0 = p[i === 0 ? 0 : i - 1], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2 === p.length ? i + 1 : i + 2];
      var c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
      var c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += "C " + c1x + "," + c1y + " " + c2x + "," + c2y + " " + p2[0] + "," + p2[1] + " ";
    }
    return d;
  }
  var roadPath = smoothPath(pts);
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
  svg += '<defs><path id="roadpath-' + distId + '" d="' + roadPath + '" /></defs>';
  svg += '<path d="' + roadPath + '" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="34" stroke-linecap="round"/>';
  svg += '<path d="' + roadPath + '" fill="none" stroke="#3B4453" stroke-width="28" stroke-linecap="round"/>';
  svg += '<path d="' + roadPath + '" fill="none" stroke="#F5E6B8" stroke-width="2" stroke-linecap="round" stroke-dasharray="9 9" opacity="0.85"/>';

  pts.forEach(function (p, i) {
    var x = p[0], y = p[1];
    var e = entries[i];
    var labelAbove = i % 2 === 0;
    var pinH = 36;
    var pinTop = labelAbove ? y - pinH - 30 : y - pinH;
    svg += '<path d="M ' + x + ' ' + y + ' C ' + (x - 13) + ' ' + (y - 16) + ', ' + (x - 13) + ' ' + (pinTop + 5) + ', ' + x + ' ' + pinTop +
      ' C ' + (x + 13) + ' ' + (pinTop + 5) + ', ' + (x + 13) + ' ' + (y - 16) + ', ' + x + ' ' + y + ' Z" fill="#C9A227" stroke="#0B1220" stroke-width="1.3"/>';
    svg += '<circle cx="' + x + '" cy="' + (pinTop + 12) + '" r="10" fill="#0B1220"/>';
    svg += '<text class="dr-road-badge-text" x="' + x + '" y="' + (pinTop + 16) + '" text-anchor="middle" fill="#F5E6B8">' + (i + 1) + '</text>';
    var labelY = labelAbove ? pinTop - 10 : pinTop + pinH + 22;
    var shortName = e.company.length > 16 ? e.company.slice(0, 15) + "…" : e.company;
    svg += '<text class="dr-road-pin-name" x="' + x + '" y="' + labelY + '" text-anchor="middle">' + esc(shortName) + '</text>';
    svg += '<text class="dr-road-pin-time" x="' + x + '" y="' + (labelY + 13) + '" text-anchor="middle">' + esc(e.time || "") + '</text>';
  });

  svg += '<g><g><animateMotion dur="' + (6 + n * 2) + 's" repeatCount="indefinite" rotate="auto"><mpath href="#roadpath-' + distId + '"/></animateMotion>' +
    '<g transform="translate(-13,-8)"><rect x="0" y="4" width="26" height="9" rx="3" fill="#C9A227"/><rect x="5" y="0" width="14" height="7" rx="2.5" fill="#F5E6B8"/>' +
    '<circle cx="6" cy="14" r="3" fill="#0B1220"/><circle cx="20" cy="14" r="3" fill="#0B1220"/>' +
    '<circle cx="6" cy="14" r="1.2" fill="#5B6472"/><circle cx="20" cy="14" r="1.2" fill="#5B6472"/></g></g></g>';
  svg += "</svg>";
  return svg;
}

function thaiDateLabel(dateStr) {
  var d = new Date(dateStr + "T00:00:00");
  var days = ["วันอาทิตย์", "วันจันทร์", "วันอังคาร", "วันพุธ", "วันพฤหัสบดี", "วันศุกร์", "วันเสาร์"];
  var months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
  return days[d.getDay()] + "ที่ " + d.getDate() + " " + months[d.getMonth()] + " " + (d.getFullYear() + 543);
}

function onDailyReportSubmit(ev) {
  ev.preventDefault();
  var f = ev.target;
  var errEl = document.getElementById("dr-form-error");
  var company = f.company.value.trim();
  var activities = Array.prototype.slice.call(f.querySelectorAll('#dr-activity-chips input:checked')).map(function (c) { return c.value; });
  if (!company) { errEl.textContent = "กรุณาระบุชื่อบริษัทที่เข้าพบ"; errEl.style.display = "block"; return false; }
  if (activities.length === 0) { errEl.textContent = "กรุณาเลือกกิจกรรมที่ทำอย่างน้อย 1 รายการ"; errEl.style.display = "block"; return false; }
  errEl.style.display = "none";
  var entry = {
    id: "r" + Date.now() + Math.floor(Math.random() * 1000),
    date: f.date.value || todayISO(),
    time: f.time.value || nowHHMM(),
    person: f.person.value.trim(),
    company: company,
    activities: activities,
    feedback: f.feedback.value.trim(),
    createdAt: new Date().toISOString()
  };
  addDailyReport(entry);
  f.company.value = ""; f.person.value = ""; f.feedback.value = "";
  f.time.value = nowHHMM();
  f.querySelectorAll('#dr-activity-chips input:checked').forEach(function (c) { c.checked = false; });
  refreshDailyReportList();
  return false;
}

function copyDayReport() {
  var txt = buildDayReportText(STATE.dailyReportModalDate);

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done).catch(function () { fallbackCopy(txt); done(); });
  } else { fallbackCopy(txt); done(); }
}
function fallbackCopy(txt) {
  var ta = document.createElement("textarea");
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
}
function printDayReport() {

function downloadDayReport() {

/* ============================== BACKUP: EXPORT / IMPORT ============================== */
function exportBackup() {
  var payload = {
    app: "EMT-Sales-Pipeline", version: 1, exportedAt: new Date().toISOString(),
    projects: STATE.projects, statuses: STATE.statuses
  };
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  var ts = new Date();
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  var fname = "emt-backup-" + ts.getFullYear() + pad(ts.getMonth() + 1) + pad(ts.getDate()) + "-" + pad(ts.getHours()) + pad(ts.getMinutes()) + ".json";
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  LocalStore.set(BACKUP_COUNT_KEY, "0");
  showToast("ดาวน์โหลดไฟล์สำรองแล้ว: " + fname);
}

function triggerImportFile() {
  var el = document.getElementById("import-file-input");
  if (el) el.click();
}

function handleImportFile(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function (e) {
    try {
      var payload = JSON.parse(e.target.result);
      if (!payload || !Array.isArray(payload.projects)) throw new Error("invalid structure");
      STATE.importPending = payload;
      renderModals();
    } catch (err) {
      showToast("ไฟล์ไม่ถูกต้อง ไม่สามารถนำเข้าได้ — กรุณาเลือกไฟล์สำรอง .json ที่ดาวน์โหลดจากแอปนี้");
    }
  };
  reader.readAsText(file);
  input.value = "";
}

function cancelImport() { STATE.importPending = null; renderModals(); }
function confirmImport() {
  if (!canEdit()) { showToast("คุณมีสิทธิ์ดูข้อมูลอย่างเดียว ไม่สามารถนำเข้าข้อมูลได้"); STATE.importPending = null; renderModals(); return; }
  var payload = STATE.importPending;
  STATE.projects = payload.projects;
  STATE.statuses = (Array.isArray(payload.statuses) && payload.statuses.length) ? payload.statuses : DEFAULT_STATUSES.slice();
  LocalStore.set(STORAGE_KEY, JSON.stringify(STATE.projects));
  LocalStore.set(STATUS_KEY, JSON.stringify(STATE.statuses));
  STATE.importPending = null;
  scheduleCloudPush();
  window.setTimeout(function () {
    renderModals();
    renderApp();
    showToast("นำเข้าข้อมูลสำรองเรียบร้อยแล้ว");
  }, 0);
}

function renderImportConfirmModal() {
  var p = STATE.importPending;
  var newCount = p.projects.length;
  var curCount = STATE.projects.length;
  var when = p.exportedAt ? new Date(p.exportedAt).toLocaleString("th-TH") : "ไม่ทราบวันที่";
  return '<div class="modal-overlay" onmousedown="if(event.target===this) cancelImport()">' +
    '<div class="modal-panel" style="max-width:440px;height:auto">' +
    '<div style="padding:22px 22px 8px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">' +
    '<div style="width:34px;height:34px;border-radius:99px;background:' + COLORS.amberBg + ';display:flex;align-items:center;justify-content:center">' + icon("alert", 16, COLORS.amber) + '</div>' +
    '<div class="disp" style="font-size:15.5px">นำเข้าข้อมูลสำรอง?</div></div>' +
    '<div style="font-size:12.5px;color:' + COLORS.muted + ';margin-left:44px;line-height:1.6">' +
    'ไฟล์สำรองนี้มี <strong>' + newCount + ' งาน</strong> (สำรองไว้เมื่อ ' + esc(when) + ')<br/>' +
    'การนำเข้าจะ<strong style="color:' + COLORS.red + '">เขียนทับข้อมูลปัจจุบันทั้งหมด</strong> (ตอนนี้มี ' + curCount + ' งาน) — หากยังไม่ได้สำรองข้อมูลปัจจุบันไว้ แนะนำให้กด "ยกเลิก" แล้วดาวน์โหลดสำรองก่อน' +
    '</div></div>' +
    '<div class="modal-footer" style="border-top:none">' +
    '<button class="btn-secondary" onclick="cancelImport()">ยกเลิก</button>' +
    '<button class="btn-primary" style="background:' + COLORS.amber + '" onclick="confirmImport()">นำเข้าและเขียนทับ</button></div></div></div>';
}

/* ============================== INIT ============================== */
function renderBulkAddModal() {
  return '<div class="modal-overlay" onmousedown="if(event.target===this) closeBulkAddModal()">' +
    '<div class="modal-panel" style="width:700px">' +
    '<div class="modal-header"><div><div class="disp" style="font-size:17px">เพิ่มงานหลายรายการ (วางจาก Excel)</div>' +
    '<div style="font-size:11.5px;color:' + COLORS.muted + ';margin-top:2px">คัดลอกแถวจาก Excel มาวางได้เลย เรียงคอลัมน์: Job No. → Status → วันที่ (dd/mm/yy) → Invoice → ลูกค้า → รายละเอียดงาน → มูลค่า</div></div>' +

    '<textarea id="bulk-add-textarea" class="field-input" style="min-height:130px;font-family:Consolas,monospace;font-size:12px;resize:vertical" placeholder="J1774&#9;On process&#9;31/07/26&#9;&#9;SNU&#9;Ball valve 6&quot; 600# welding&#9;15,000.00" oninput="refreshBulkPreview()"></textarea>' +
    '<div style="margin-top:14px" id="bulk-preview-wrap">' + '<div style="font-size:12px;color:' + COLORS.muted + ';padding:10px 0">วางข้อมูลด้านบนเพื่อดูตัวอย่าง</div>' + '</div>' +
    '<div style="font-size:10.5px;color:' + COLORS.muted + ';margin-top:10px">ช่องที่ไม่ได้ระบุ (Segment, Type, ประเภทงาน, ผู้ติดต่อ, เบอร์โทร, Deadline ฯลฯ) จะเว้นว่างไว้ให้แก้ไขเพิ่มทีหลังในตาราง</div>' +
    '</div>' +
    '<div class="modal-footer"><button type="button" class="btn-secondary" onclick="closeBulkAddModal()">ยกเลิก</button>' +
    '<button type="button" class="btn-primary" onclick="submitBulkAdd()">' + icon("check", 15) + ' เพิ่มทั้งหมด</button></div>' +
    '</div></div>';
}

function renderResetConfirmModal() {
  var jobCount = STATE.projects.length;
  var seedCount = SEED_DATA.length;
  return '<div class="modal-overlay" onmousedown="if(event.target===this) cancelResetToSeed()">' +
    '<div class="modal-panel" style="max-width:440px;height:auto">' +
    '<div style="padding:22px 22px 8px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">' +
    '<div style="width:34px;height:34px;border-radius:99px;background:' + COLORS.redBg + ';display:flex;align-items:center;justify-content:center">' + icon("alert", 16, COLORS.red) + '</div>' +
    '<div class="disp" style="font-size:15.5px">รีเซ็ตข้อมูลทั้งหมด?</div></div>' +
    '<div style="font-size:12.5px;color:' + COLORS.muted + ';margin-left:44px;line-height:1.7">' +
    'ตอนนี้มีข้อมูลอยู่ <strong style="color:' + COLORS.ink + '">' + jobCount + ' งาน</strong><br/>' +
    'การรีเซ็ตจะ<strong style="color:' + COLORS.red + '">ลบข้อมูลทั้งหมดทิ้ง แล้วแทนที่ด้วยชุดเริ่มต้น ' + seedCount + ' งาน</strong> ทันที ทั้งในเครื่องนี้และบนคลาวด์ — ' +
    '<strong>กู้คืนไม่ได้</strong> (ระบบจะดาวน์โหลดไฟล์สำรองของข้อมูลปัจจุบันให้อัตโนมัติก่อนรีเซ็ต แต่ต้องนำเข้าไฟล์นั้นเองทีหลังถ้าต้องการกู้คืน)' +
    '</div></div>' +
    '<div class="modal-footer" style="border-top:none">' +
    '<button class="btn-secondary" onclick="cancelResetToSeed()">ยกเลิก</button>' +
    '<button class="btn-primary" style="background:' + COLORS.red + '" onclick="resetToSeed()">' + icon("reset", 14) + ' ยืนยันรีเซ็ต (' + jobCount + ' → ' + seedCount + ' งาน)</button></div></div></div>';
}

function init() {
  loadAll();
  STATE.cloudUrl = LocalStore.get(CLOUD_URL_KEY) || DEFAULT_CLOUD_URL || "";
  STATE.googleClientId = LocalStore.get(GOOGLE_CLIENT_ID_KEY) || "";
  var savedAuth = LocalStore.get(AUTH_KEY);
  if (savedAuth) {
    try {
      var a = JSON.parse(savedAuth);
      if (a && a.exp && a.exp > Date.now()) STATE.auth = a;
    } catch (e) { /* ignore */ }
  }
  try { STATE.commissionUnlocked = window.sessionStorage.getItem(COMMISSION_UNLOCK_KEY) === "1"; } catch (e) {}
  STATE.firebaseUrl = LocalStore.get(FIREBASE_URL_KEY) || DEFAULT_FIREBASE_URL || "";
  renderApp();
  if (STATE.cloudUrl && !needsLoginGate()) {
    window.setTimeout(function () { pullFromCloud(false); }, 200);
  }
  if (STATE.firebaseUrl && !needsLoginGate()) {
    window.setTimeout(function () { firebaseReadOnce(); firebaseStartListening(); }, 200);
  }
  window.setInterval(function () {
    if (document.visibilityState !== "visible") return;
    if (!STATE.cloudUrl || needsLoginGate()) return;
    var busy = STATE.formOpen || STATE.statusManagerOpen || STATE.confirmDeleteId !== null || STATE.importPending;
    var typing = document.activeElement && ["INPUT", "SELECT", "TEXTAREA"].indexOf(document.activeElement.tagName) !== -1;
    if (busy || typing) return;
    pullFromCloud(false);
  }, 45000);
}
init();
</script>
